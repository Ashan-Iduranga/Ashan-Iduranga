name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#162542&color_dots=#e9eef7,#bcd3fe,#7aa8fd,#3d84fc,#136cfc
            dist/snake-dark.svg?palette=github-dark&color_snake=#5B9BFF&color_dots=#161b22,#0e2a5c,#0f4bb0,#136cfc,#5b9bff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
